# `man tmux` for info on commands
# or https://man7.org/linux/man-pages/man1/tmux.1.html


## Remove default Prefix of Ctrl + b
unbind-key C-b

## Set Prefix to Ctrl + j and  set Prefix2 to Ctrl + f
set-option -g prefix C-j
set-option -g prefix2 C-f
unbind-key C-j
unbind-key C-f
bind-key C-j send-prefix
bind-key C-f send-prefix -2

## Make `Prefix + r` reload the config file
unbind r
bind r source-file ~/.tmux.conf \; \
      display-message ".tmux.conf reloaded."

## Set terminal colors
#set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"

## Remove esc key delay
set -s escape-time 0

## Use Vim shortcuts
setw -g mode-keys vi

## Remap horizontal split window
unbind %
bind | split-window -h

## Remap vertical split window
unbind '"'
bind - split-window -v

## Select panes with vi motion
bind -r h select-pane -L
bind -r l select-pane -R 
bind -r k select-pane -U 
bind -r j select-pane -D 

## Resize panes in different directions using Shift + Arrow 
bind -n -r S-Down resize-pane -D 5
bind -n -r S-Up resize-pane -U 5
bind -n -r S-Right resize-pane -R 5
bind -n -r S-Left resize-pane -L 5

## Easily reorder windows with CTRL + SHIFT + Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

## Maximize current window
bind -r m resize-pane -Z 5

## Enable mouse
set -g mouse on

## Tmux Plugin manager (TPM)
#   - Install plugins `prefix + I`
#   - Uninstall plugins `prefix + alt + u`
set -g @plugin 'tmux-plugins/tpm'

## List of plugins
#set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'christoomey/vim-tmux-navigator' # navigate between vim & tmux w/ Ctrl + <h,j,k,l>
set -g @plugin 'tmux-plugins/tmux-resurrect' # restores sessions after system restart. Restore: prefix + Ctrl-r, Save: prefix + Ctrl-s.
set -g @plugin 'tmux-plugins/tmux-continuum' # saves sessions every 15 mins. 
set -g @plugin 'wfxr/tmux-power' # theme


## Sets resurrect & continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'
#set -g @continuum-boot-options 'iterm,fullscreen'
#set -g status-right 'Continuum status: #{continuum_status}'

## Theme settings
set -g @tmux_power_theme 'sky' # moon, snow, sky

## Auto install tpm plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

