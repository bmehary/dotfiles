# `man tmux` for info on commands
# or https://man7.org/linux/man-pages/man1/tmux.1.html

# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set terminal colors
#set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"

# Remove esc key delay
set -s escape-time 0

# Use Vim shortcuts
setw -g mode-keys vi

# Remap horizontal split window
unbind %
bind | split-window -h

# Remap vertical split window
unbind '"'
bind - split-window -v

# Make `Ctrl+A r` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# Resize panes in different directions using j,k,l,m (vim style)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize current window
bind -r m resize-pane -Z 5

# Enable mouse
set -g mouse on

# Tmux Plugin manager (TPM)
#   - Install plugins `prefix + I`
#   - Uninstall plugins `prefix + alt + u`
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # restores sessions after system restart
set -g @plugin 'tmux-plugins/tmux-continuum' # saves sessions every 15 mins
set -g @plugin 'wfxr/tmux-power' # theme


# Sets resurrect & continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Theme settings
set -g @tmux_power_theme 'sky' # moon, snow, sky

# Auto install tpm plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

