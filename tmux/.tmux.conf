# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# Remap horizontal split window
unbind %
bind | split-window -h

# Remap vertical split window
unbind '"'
bind - split-window -v

# Make `Ctrl+A r` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# Resize panes in different directions using j,k,l,m (vim style)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize current window
bind -r m resize-pane -Z 5

# Enable mouse
set -g mouse on

# Install plugs `Ctrl+A I`
# Plugin manager (TPM)
set -g @plugin 'tmux-plugins/tpm'

# List of plugins
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # restores sessions after system restart
set -g @plugin 'tmux-plugins/tmux-continuum' # saves sessions every 15 mins


# Sets resurrect & continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
