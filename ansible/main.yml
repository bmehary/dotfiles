- name: My first playbook
  hosts: all
  gather_facts: true

  vars:
    # Enable this when debugging
    print_ansible_facts: false
  
  pre_tasks:
    - name: Homebrew Pre-task
      ansible.builtin.import_tasks: pre_tasks/homebrew.yml
      tags:
        - always
  
  tasks:
    # gather_facts needs to be set
    - name: Print all available facts
      ansible.builtin.debug:
        var: ansible_facts
      when: print_ansible_facts
      tags:
        - always
    
    - name: Print current run tags
      ansible.builtin.debug:
        var: ansible_run_tags
      when: print_ansible_facts
      tags:
        - always

    # ansible_facts need to be gather for `when` clause to work
    - name: Run macos task
      ansible.builtin.command: pwd
      # when: ansible_facts['distribution']=="MacOSX"
      when: ansible_distribution == "MacOSX"

    - name: Run ubuntu task
      ansible.builtin.command: pwd
      when: ansible_distribution == "Ubuntu"

    - name: Run macos task (installs tag)
      ansible.builtin.command: pwd
      when: ansible_distribution == "MacOSX"
      tags:
        - installs

    # Set roles & run them
    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: "{{ ansible_run_tags != ['all'] and ansible_run_tags or default_roles | difference(exclude_roles | default([])) | sort }}"
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always
